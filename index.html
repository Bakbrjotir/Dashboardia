<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0C0D0F; --panel:#141618; --panel2:#131518; --chip:#2F343A;
  --tint1:rgba(255,255,255,.02); --tint2:rgba(255,255,255,.03); --tint3:rgba(255,255,255,.05);
  --hair:rgba(255,255,255,.06); --hair2:rgba(255,255,255,.08);
  --t1:#F1EFE9; --t2:#D9D7D1; --t3:#9AA0A8; --t4:#8A9099; --t5:#5F656D; --on-amber:#0C0D0F;
  --amber:#F2A93B; --amber-l:#F7C46A; --amber-d:#E89A2C;
  --amber-08:rgba(242,169,59,.08); --amber-10:rgba(242,169,59,.10); --amber-16:rgba(242,169,59,.16);
  --dip:#6FB3D2; --mom:#C9A0DC; --line:#6FB3D2; --area:rgba(111,179,210,.10);
  --up:#4ADE80; --down:#F07A7A; --up-10:rgba(74,222,128,.10); --down-10:rgba(240,122,122,.10);
  --paper:#F5F1E6; --paper-ink:#1A1712; --paper-ink2:#5C554A;
  --sans:"Figtree","Nunito Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Courier Prime","Courier New",Courier,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--t1)}
body{font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:1040px;margin:0 auto;padding:0 0 40px}
/* top rail */
.rail{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(180deg,var(--amber-l),var(--amber-d));position:relative;flex:none}
.mark::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(closest-side,var(--amber-16),transparent);z-index:-1}
.mark::after{content:"";position:absolute;left:8px;top:7px;width:4px;height:12px;background:var(--on-amber);border-radius:1px;box-shadow:6px 0 0 var(--on-amber)}
.brand h1{font-size:21px;font-weight:700;letter-spacing:-.012em;margin:0}
.stamp{font-family:var(--mono);font-size:12px;color:var(--t3);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);flex:none}
.dot.warn{background:var(--amber)} .dot.bad{background:var(--down)}
.stamp b{color:var(--t2);font-weight:400}
/* tabs */
.tabs{display:flex;gap:0;background:var(--panel2);border-bottom:1px solid var(--hair);padding:0 8px}
.tabs button{border:0;background:transparent;color:var(--t4);font:700 12.5px var(--sans);letter-spacing:.01em;padding:14px 14px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber);background:linear-gradient(180deg,transparent,var(--amber-08))}
.tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;border-radius:4px}
/* content */
.err{display:none;margin:12px 16px 0;padding:12px 14px;border-radius:10px;background:var(--down-10);color:var(--down);font-family:var(--mono);font-size:12.5px;border:1px solid var(--hair)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:20px 16px 8px}
.val{font-weight:800;font-size:clamp(40px,9vw,64px);letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums;font-family:var(--sans)}
.sub{font-family:var(--mono);font-size:12px;color:var(--t3);margin-top:8px;letter-spacing:.02em}
.delta{font-family:var(--mono);font-size:14px;padding:8px 12px;border-radius:9px;white-space:nowrap;border:1px solid var(--hair)}
.delta.up{color:var(--up);background:var(--up-10)} .delta.down{color:var(--down);background:var(--down-10)} .delta.flat{color:var(--t3);background:var(--tint2)}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:12px 16px}
@media (min-width:760px){.grid.two{grid-template-columns:1fr 340px}}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:16px}
.micro{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--t4)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.tile{background:var(--tint2);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;min-height:56px}
.tile .v{font-family:var(--mono);font-size:15px;margin-top:4px;color:var(--t1);font-variant-numeric:tabular-nums}
.tile .v.pos{color:var(--up)} .tile .v.neg{color:var(--down)}
.chartbox{position:relative;padding:12px 8px 6px}
.ranges{display:flex;gap:6px;justify-content:flex-end;padding:0 6px 8px}
.ranges button{border:1px solid var(--hair2);background:transparent;color:var(--t4);font:700 11px var(--mono);letter-spacing:.10em;padding:5px 9px;border-radius:8px;cursor:pointer}
.ranges button[aria-pressed="true"]{background:var(--amber-10);color:var(--amber);border-color:var(--amber-d)}
.ranges button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
svg{width:100%;height:auto;display:block;font-family:var(--mono);font-size:11px;touch-action:pan-y}
svg text{fill:var(--t5)}
.tip{position:absolute;pointer-events:none;background:var(--chip);color:var(--t1);font:400 12px var(--mono);padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-125%);display:none;border:1px solid var(--hair2)}
h2{font-size:12.5px;font-weight:700;letter-spacing:.01em;margin:0 0 10px;color:var(--t2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:right;padding:0 10px;height:48px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);font-weight:400;height:36px}
td:first-child,th:first-child{text-align:left;padding-left:0} td:last-child,th:last-child{padding-right:0}
td{font-family:var(--mono);color:var(--t2)}
td:first-child{font-family:var(--sans);font-weight:700;color:var(--t1)}
tr:last-child td{border-bottom:0}
.pos{color:var(--up)} .neg{color:var(--down)}
.pill{display:inline-block;font:700 10.5px var(--mono);letter-spacing:.10em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.pill.dip{color:var(--dip);background:rgba(111,179,210,.10)} .pill.mom{color:var(--mom);background:rgba(201,160,220,.10)}
.pill.warn{color:var(--amber);background:var(--amber-10)} .pill.dim{color:var(--t4);background:var(--tint3)}
.note{font-size:12.5px;color:var(--t4);margin:10px 0 0}
/* the one bright object */
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:0;padding:18px 20px;font-family:var(--mono);font-size:13px;line-height:1.5}
.sheet .h{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-ink2);margin-bottom:10px;display:flex;justify-content:space-between}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 16px}
.sheet dt{color:var(--paper-ink2)} .sheet dd{margin:0;font-weight:700}
.sheet .line{border-top:1px solid rgba(26,23,18,.15);margin:10px 0}
.sheet .ev{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.sheet .ev .done{color:var(--paper-ink2);text-decoration:line-through}
.sheet .ev .next{font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="brand"><div class="mark" aria-hidden="true"></div><h1>Two Books</h1></div>
    <div class="stamp" id="stamp"><span class="dot warn"></span>loading…</div>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="bot" aria-selected="true">BOT</button>
    <button role="tab" data-tab="rest" aria-selected="false">REST OF PORTFOLIO</button>
    <button role="tab" data-tab="total" aria-selected="false">TOTAL</button>
  </div>
  <div class="err" id="err"></div>
  <section id="view"></section>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const fmt$=v=>(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtP=v=>(v>0?'+':'')+v.toFixed(2)+'%';
const cls=v=>v>0.005?'pos':v<-0.005?'neg':'';
const NS='http://www.w3.org/2000/svg';
const el=(n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const JOBS=[['08:30','Morning check'],['09:31','Opening prices'],['09:44','Momentum buying'],['10:14','Dip buying'],['14:00','Dip selling'],['15:54','Momentum selling'],['16:30','End of day']];
let latest=null, hist=null, tab='bot', range='1W';
try{tab=localStorage.getItem('tb.tab')||tab;range=localStorage.getItem('tb.range')||range}catch(e){}

async function load(){
  const q='?ts='+Date.now();
  try{
    const [a,b]=await Promise.all([fetch('latest.json'+q,{cache:'no-store'}),fetch('history.json'+q,{cache:'no-store'})]);
    if(!a.ok||!b.ok) throw new Error('HTTP '+a.status+'/'+b.status);
    latest=await a.json(); hist=await b.json();
    $('#err').style.display='none';
  }catch(e){
    $('#err').textContent='Could not load data: '+e.message+(latest?' — showing the last good copy.':'');
    $('#err').style.display='block';
    if(!latest) return;
  }
  render();
}

function etNow(){ // wall clock in New York from the snapshot's offset
  const m=/([+-]\d\d):(\d\d)$/.exec(latest.generated_at); const off=m?(parseInt(m[1])*60+Math.sign(parseInt(m[1]))*parseInt(m[2])):-240;
  return new Date(Date.now()+off*60000);
}
function stamp(){
  const t=new Date(latest.generated_at); const mins=Math.round((Date.now()-t)/60000);
  const when=t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' '+t.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  const age=mins<1?'just now':mins<60?mins+' min ago':Math.round(mins/60)+' h ago';
  const dot=mins>120?'bad':mins>20?'warn':'';
  $('#stamp').innerHTML='<span class="dot '+dot+'"></span>UPDATED <b>'+when+'</b> · '+age;
}

function series(){
  const key=tab; const rows=(hist&&hist.rows)||[];
  const now=Date.now(); const span={'1D':1,'1W':7,'1M':31,'ALL':1e6}[range]*864e5;
  let pts=rows.filter(r=>now-new Date(r.t)<=span).map(r=>({t:new Date(r.t),v:r[key],p:r[key+'_pct']}));
  if(pts.length<2&&rows.length) pts=rows.slice(-Math.min(rows.length,2)).map(r=>({t:new Date(r.t),v:r[key],p:r[key+'_pct']}));
  if(pts.length>600){const step=pts.length/600;pts=pts.filter((_,i)=>Math.floor(i%step)===0||i===pts.length-1)}
  return pts;
}

function chart(pts){
  const W=640,H=250,L=58,R=14,T=14,B=26;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'Value over time'});
  if(pts.length<2){svg.appendChild(el('text',{x:W/2,y:H/2,'text-anchor':'middle'},'NOT ENOUGH HISTORY YET — THE CURVE STARTS WITH THE NEXT SNAPSHOTS'));return {svg,tip:document.createElement('div')}}
  const vs=pts.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs); if(hi-lo<1e-9){lo-=1;hi+=1}
  const pad=(hi-lo)*0.10; lo-=pad; hi+=pad;
  const t0=pts[0].t.getTime(), t1=pts[pts.length-1].t.getTime()||t0+1;
  const x=t=>L+(t-t0)/(t1-t0||1)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4; svg.appendChild(el('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:css('--hair2'),'stroke-width':1}));
    svg.appendChild(el('text',{x:L-8,y:y(v)+4,'text-anchor':'end'},v>=10000?'$'+(v/1000).toFixed(1)+'K':'$'+v.toFixed(0)))}
  const xt=Math.min(5,pts.length-1); for(let i=0;i<=xt;i++){const t=t0+(t1-t0)*i/xt; const d=new Date(t);
    const lab=(t1-t0)>2*864e5?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase():d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    svg.appendChild(el('text',{x:x(t),y:H-8,'text-anchor':i===0?'start':i===xt?'end':'middle'},lab))}
  const base=pts[0].v; svg.appendChild(el('line',{x1:L,x2:W-R,y1:y(base),y2:y(base),stroke:css('--t5'),'stroke-width':1}));
  const d='M'+pts.map(p=>x(p.t.getTime()).toFixed(1)+','+y(p.v).toFixed(1)).join(' L');
  svg.appendChild(el('path',{d:d+` L${x(t1).toFixed(1)},${y(lo)} L${x(t0).toFixed(1)},${y(lo)} Z`,fill:css('--area')}));
  svg.appendChild(el('path',{d,fill:'none',stroke:css('--line'),'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
  const last=pts[pts.length-1]; svg.appendChild(el('circle',{cx:x(last.t.getTime()),cy:y(last.v),r:4.5,fill:css('--amber'),stroke:css('--panel'),'stroke-width':2}));
  const vline=el('line',{y1:T,y2:H-B,stroke:css('--t5'),'stroke-width':1,visibility:'hidden'}); const dot=el('circle',{r:4,fill:css('--amber'),stroke:css('--panel'),'stroke-width':2,visibility:'hidden'});
  svg.appendChild(vline); svg.appendChild(dot);
  const hit=el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'transparent'}); svg.appendChild(hit);
  const tip=document.createElement('div'); tip.className='tip';
  const show=ev=>{const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width*W; const tt=t0+(px-L)/(W-L-R)*(t1-t0);
    let best=pts[0],bd=1e18; for(const p of pts){const dd=Math.abs(p.t.getTime()-tt); if(dd<bd){bd=dd;best=p}}
    const cx=x(best.t.getTime()),cy=y(best.v); vline.setAttribute('x1',cx);vline.setAttribute('x2',cx);vline.setAttribute('visibility','visible');
    dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('visibility','visible');
    tip.textContent=best.t.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).toUpperCase()+'  '+fmt$(best.v)+'  '+fmtP(best.p);
    tip.style.left=(cx/W*r.width)+'px'; tip.style.top=(cy/H*r.height)+'px'; tip.style.display='block'};
  const hide=()=>{vline.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden');tip.style.display='none'};
  hit.addEventListener('pointermove',show); hit.addEventListener('pointerleave',hide);
  return {svg,tip};
}

function tiles(items){return '<div class="tiles">'+items.map(([k,v,c])=>`<div class="tile"><div class="micro">${k}</div><div class="v ${c||''}">${v}</div></div>`).join('')+'</div>'}

function sheet(){
  const b=latest.bot, now=etNow(); const hm=now.getUTCHours()*60+now.getUTCMinutes();
  const rg={up:'RISING',side:'FLAT',down:'FALLING'}[latest.regime]||'—';
  const bk=b.books;
  const ev=JOBS.map(([t,n])=>{const m=parseInt(t.slice(0,2))*60+parseInt(t.slice(3)); const done=m<hm; return `<span class="${done?'done':''}">${t}</span><span class="${done?'done':''}">${n}</span>`}).join('');
  const nextIdx=JOBS.findIndex(([t])=>parseInt(t.slice(0,2))*60+parseInt(t.slice(3))>=hm);
  return `<div class="sheet"><div class="h"><span>DAY SHEET</span><span>${new Date(latest.generated_at).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase()}</span></div>
  <dl><dt>Market</dt><dd>${rg}</dd><dt>Dip book</dt><dd>${bk.B.open}/${bk.B.slots} slots · ${latest.regime==='up'?'may buy':'stands down'}</dd><dt>Momentum</dt><dd>${bk.C.open}/${bk.C.slots} slots · ${latest.regime==='down'?'holds cash':bk.C.open>=bk.C.slots?'full':'may buy'}</dd>
  <dt>Breaker</dt><dd>${b.breaker.paused_sessions?'PAUSED · '+b.breaker.paused_sessions+' days':'armed'}</dd></dl>
  <div class="line"></div><div class="ev">${ev}</div>
  <div class="line"></div><div style="font-size:11px;color:var(--paper-ink2)">NEW YORK TIME · ${nextIdx<0?'session complete':'next: '+JOBS[nextIdx][0]+' '+JOBS[nextIdx][1]}</div></div>`;
}

function botTable(ps){
  if(!ps.length) return '<p class="note">No open positions. The books are in cash.</p>';
  const rows=ps.map(p=>{const near=p.stop_distance_pct!=null&&p.stop_distance_pct<2; const left=p.time_stop-p.sessions_held;
    return `<tr><td>${p.symbol}<span class="pill ${p.book==='B'?'dip':'mom'}">${p.book==='B'?'Dip':'Mom'}</span>${near?'<span class="pill warn">near stop</span>':''}</td>
    <td>${p.entry.toFixed(2)}</td><td>${p.now.toFixed(2)}</td><td class="${cls(p.pct)}">${fmtP(p.pct)}</td><td class="${cls(p.pnl)}">${fmt$(p.pnl)}</td>
    <td>${p.sessions_held}/${p.time_stop}${left<=2?'<span class="pill warn">'+left+' left</span>':''}</td>
    <td>${p.stop_distance_pct==null?'—':p.stop_distance_pct.toFixed(1)+'%'}</td></tr>`}).join('');
  return `<div class="tablewrap"><table><thead><tr><th>Position</th><th>Entry</th><th>Now</th><th>Chg</th><th>P&amp;L</th><th>Days</th><th>To stop</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Days counts trading days against each book's limit — Dip 12, Momentum 10. "To stop" is the distance above the Momentum book's 5% stop; the Dip book has no price stop by design.</p>`;
}
function restTable(r){
  const rows=r.positions.map(p=>`<tr><td>${p.symbol}${p.legacy?'<span class="pill dim">pre-bot</span>':''}</td><td>${p.opened}</td><td>${p.entry.toLocaleString()}</td><td>${p.now.toLocaleString()}</td><td>${fmt$(p.value)}</td><td class="${cls(p.pct)}">${fmtP(p.pct)}</td><td class="${cls(p.pnl)}">${fmt$(p.pnl)}</td></tr>`).join('');
  return `<div class="tablewrap"><table><thead><tr><th>Position</th><th>Opened</th><th>Entry</th><th>Now</th><th>Value</th><th>Chg</th><th>P&amp;L</th></tr></thead><tbody>${rows}
  <tr><td>Cash not used by the bot</td><td></td><td></td><td></td><td>${fmt$(r.cash)}</td><td></td><td></td></tr></tbody></table></div>`;
}

function render(){
  stamp();
  const b=latest.bot, r=latest.rest, t=latest.total; const pts=series();
  const ranges=['1D','1W','1M','ALL'].map(k=>`<button aria-pressed="${k===range}" data-r="${k}">${k}</button>`).join('');
  const chartCard=`<div class="card chartbox"><div class="ranges">${ranges}</div><div id="chart"></div></div>`;
  let head='', body='';
  if(tab==='bot'){
    const d=b.equity-b.stake; const bk=b.books;
    head=`<div class="hero"><div><div class="val">${fmt$(b.equity)}</div><div class="sub">STAKE ${fmt$(b.stake)} · CASH ${fmt$(b.cash)}</div></div><div class="delta ${d>0?'up':d<0?'down':'flat'}">${fmt$(d)} · ${fmtP(b.pct)}</div></div>`;
    body=`<div class="grid two"><div>${chartCard}<div class="card" style="margin-top:12px">${tiles([['Dip book',fmt$(bk.B.equity)+' · '+bk.B.open+'/'+bk.B.slots],['Momentum book',fmt$(bk.C.equity)+' · '+bk.C.open+'/'+bk.C.slots],['Realised',fmt$(b.realized),cls(b.realized)],['Unrealised',fmt$(b.unrealized),cls(b.unrealized)],['Commission',fmt$(b.fees_paid)],['Closed trades',String(b.closed_trades)]])}</div></div>${sheet()}</div>
    <div class="grid"><div class="card"><h2>Open positions</h2>${botTable(b.positions)}</div></div>`;
  } else if(tab==='rest'){
    const p0=(hist&&hist.meta&&hist.meta.rest0)||r.value; const d=r.value-p0;
    head=`<div class="hero"><div><div class="val">${fmt$(r.value)}</div><div class="sub">EVERYTHING THAT IS NOT THE BOT'S · SINCE ${hist&&hist.meta?new Date(hist.meta.started).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase():'START'}</div></div><div class="delta ${d>0?'up':d<0?'down':'flat'}">${fmt$(d)} · ${fmtP(p0?d/p0*100:0)}</div></div>`;
    body=`<div class="grid">${chartCard}<div class="card">${tiles([['Positions',fmt$(r.positions_value)],['Cash',fmt$(r.cash)]])}</div><div class="card"><h2>Holdings</h2>${restTable(r)}<p class="note">Measured from the first snapshot. Cash dominates this view, so it moves only when the Bitcoin does — or when money is added or withdrawn.</p></div></div>`;
  } else {
    const p0=(hist&&hist.meta&&hist.meta.total0)||t.value; const d=t.value-p0;
    head=`<div class="hero"><div><div class="val">${fmt$(t.value)}</div><div class="sub">WHOLE ACCOUNT · CASH ${fmt$(t.cash)}</div></div><div class="delta ${d>0?'up':d<0?'down':'flat'}">${fmt$(d)} · ${fmtP(p0?d/p0*100:0)}</div></div>`;
    body=`<div class="grid">${chartCard}<div class="card">${tiles([['Bot',fmt$(b.equity)+' · '+fmtP(b.pct),cls(b.pct)],['Rest',fmt$(r.value)],['Bot share',(b.equity/t.value*100).toFixed(1)+'%']])}<p class="note">The bot is about ${(b.equity/t.value*100).toFixed(0)}% of the account — which is why every tab has its own scale. On one axis the bot would be a flat line on the floor.</p></div></div>`;
  }
  $('#view').innerHTML=head+body;
  const c=chart(pts); const box=$('#chart'); box.innerHTML=''; box.appendChild(c.svg); box.parentElement.appendChild(c.tip);
  document.querySelectorAll('.ranges button').forEach(bt=>bt.addEventListener('click',()=>{range=bt.dataset.r;try{localStorage.setItem('tb.range',range)}catch(e){};render()}));
}

document.querySelectorAll('#tabs button').forEach(bt=>bt.addEventListener('click',()=>{tab=bt.dataset.tab;try{localStorage.setItem('tb.tab',tab)}catch(e){};
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===bt)); if(latest) render()}));
document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===tab));
load(); setInterval(load,60000);
})();
</script>
</body>
</html>
