<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboardia">
<title>Dashboardia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23F2A93B'/%3E%3Crect x='20' y='18' width='9' height='28' rx='2' fill='%230C0D0F'/%3E%3Crect x='35' y='18' width='9' height='28' rx='2' fill='%230C0D0F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0C0D0F; --panel:#141618; --panel2:#131518; --chip:#2F343A;
  --tint1:rgba(255,255,255,.02); --tint2:rgba(255,255,255,.03); --tint3:rgba(255,255,255,.05); --tint4:rgba(255,255,255,.08);
  --hair:rgba(255,255,255,.06); --hair2:rgba(255,255,255,.08);
  --t1:#F1EFE9; --t2:#D9D7D1; --t3:#9AA0A8; --t4:#8A9099; --t5:#5F656D; --on-amber:#0C0D0F;
  --amber:#F2A93B; --amber-l:#F7C46A; --amber-d:#E89A2C;
  --amber-08:rgba(242,169,59,.08); --amber-10:rgba(242,169,59,.10); --amber-16:rgba(242,169,59,.16);
  --dip:#6FB3D2; --mom:#C9A0DC; --dip-10:rgba(111,179,210,.10); --mom-10:rgba(201,160,220,.10);
  --teal:#7CC5B0; --silver:#C9CDD3;
  --line:var(--dip); --area:rgba(111,179,210,.14); --glow:rgba(111,179,210,.30);
  --mkt:#8E949C;  /* the benchmark line: neutral on purpose, so the tab's own colour leads */
  --up:#4ADE80; --down:#F07A7A; --up-10:rgba(74,222,128,.10); --down-10:rgba(240,122,122,.10);
  --sheet:#1A1814; --sheet-hair:rgba(242,169,59,.14);
  --sans:"Figtree","Nunito Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Courier Prime","Courier New",Courier,monospace;
  --gutter:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --nav-h:60px;
}
/* each tab draws its curve in its own hue, so the eye knows where it is */
body[data-tab="rest"]{--line:var(--teal);--area:rgba(124,197,176,.14);--glow:rgba(124,197,176,.30)}
body[data-tab="total"]{--line:var(--silver);--area:rgba(201,205,211,.12);--glow:rgba(201,205,211,.22);--mkt:#71767D}
*{box-sizing:border-box}
html{background:var(--ground);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font-family:inherit;touch-action:manipulation}
.wrap{max-width:1040px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter-r)}

/* type roles */
.caps{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--t4)}
.title{font-size:15px;font-weight:700;letter-spacing:-.005em;color:var(--t1);margin:0}
.subtitle{font-size:12.5px;color:var(--t4);margin:2px 0 0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--up)} .neg{color:var(--down)}

/* top rail */
.rail{background:var(--panel);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px)}
.rail .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;min-height:56px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(180deg,var(--amber-l),var(--amber-d));position:relative;flex:none}
.mark::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(closest-side,var(--amber-16),transparent);z-index:-1}
.mark::after{content:"";position:absolute;left:8px;top:7px;width:4px;height:12px;background:var(--on-amber);border-radius:1px;box-shadow:6px 0 0 var(--on-amber)}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.012em;margin:0;white-space:nowrap}
.envb{font:700 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--t3);background:var(--tint3);padding:4px 7px;border-radius:999px;flex:none}
.envb.live{color:var(--amber);background:var(--amber-10)}
.stamp{font-family:var(--mono);font-size:12px;color:var(--t3);display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);flex:none}
.dot.warn{background:var(--amber)} .dot.bad{background:var(--down)} .dot.off{background:var(--t5)}
.stamp b{color:var(--t2);font-weight:400}

/* tabs: a top strip on wide screens, a bottom bar on phones */
.tabs{position:sticky;top:0;z-index:5;background:rgba(19,21,24,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.tabs .wrap{display:flex;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:transparent;color:var(--t4);font:700 12.5px var(--sans);letter-spacing:.02em;padding:15px 12px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;user-select:none;-webkit-user-select:none;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button svg{display:none;width:22px;height:22px}
.tabs button .s{display:none}
.tabs button[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber);background:linear-gradient(180deg,transparent,var(--amber-08))}
.tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;border-radius:4px}

/* content */
.app{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.err{display:none;margin:12px 0 0;padding:12px 14px;border-radius:10px;background:var(--down-10);color:var(--down);font-family:var(--mono);font-size:12.5px;border:1px solid var(--hair)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:22px 0 10px}
.hero>div:first-child{min-width:0}
.val{font-weight:800;font-size:clamp(38px,9vw,64px);letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sub{font-family:var(--mono);font-size:12px;color:var(--t3);margin-top:8px;letter-spacing:.02em}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* One primary chip per tab - the headline delta, filled. Everything else is a
   secondary chip: same shape and label, neutral ground, colour only on the
   number. Three filled greens competing was the thing to avoid. */
.delta,.chip{font-family:var(--mono);font-size:14px;padding:8px 12px;border-radius:9px;white-space:nowrap;border:1px solid var(--hair);display:inline-flex;align-items:center;gap:8px}
.delta svg,.chip svg{width:9px;height:9px;flex:none}
.delta.up{color:var(--up);background:var(--up-10)} .delta.down{color:var(--down);background:var(--down-10)} .delta.flat{color:var(--t3);background:var(--tint2)}
.delta.flat svg{display:none}
.delta .k,.delta small,.chip .k,.chip small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t4)}
.chip{background:var(--tint2);color:var(--t2)}
.chip .n.pos{color:var(--up)} .chip .n.neg{color:var(--down)} .chip .n{font-variant-numeric:tabular-nums}
.chip.flat svg{display:none}
.chip svg{color:var(--t4)} .chip.up svg{color:var(--up)} .chip.down svg{color:var(--down)}
.regime{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:8px 12px;border-radius:9px;border:1px solid var(--hair);background:var(--tint2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.regime .dot{background:var(--t4)} .regime.up .dot{background:var(--up)} .regime.down .dot{background:var(--down)}

/* the page is one vertical stack; one row of it splits in two on wide screens */
.page{display:grid;gap:12px;padding:8px 0 0}
.page>*{min-width:0}
.two{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.two>*{min-width:0}
@media (min-width:820px){.two{grid-template-columns:minmax(0,1fr) 340px}}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:16px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-h>div:first-child{min-width:0}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);background:var(--tint3);padding:5px 9px;border-radius:999px;white-space:nowrap;flex:none}

/* tiles: label / value / one line of context / optional meter */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--tint2);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:5px}
.tile .v{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.tile .v.pos{color:var(--up)} .tile .v.neg{color:var(--down)}
.tile .c{font-family:var(--mono);font-size:11px;color:var(--t4);line-height:1.4}
.tile .bar{margin-top:3px}
.bar{height:4px;background:var(--tint4);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--amber);min-width:0}
.bar.dip i{background:var(--dip)} .bar.mom i{background:var(--mom)}
.bar.split{display:flex;gap:2px} .bar.split i{border-radius:2px}

/* chart card */
.chartbox{position:relative}
/* the chart's controls: the benchmark toggle reads as a mode switch, the ranges as a dial */
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.mtog{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--hair2);background:var(--tint2);color:var(--t3);font:700 11px var(--mono);letter-spacing:.10em;text-transform:uppercase;border-radius:9px;cursor:pointer;white-space:nowrap}
.mtog svg{width:14px;height:14px;flex:none;opacity:.6}
.mtog[aria-pressed="true"]{background:var(--amber-16);border-color:var(--amber);color:var(--amber)}
.mtog[aria-pressed="true"] svg{opacity:1}
.mtog:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
@media (hover:hover){.mtog:hover{color:var(--t2);border-color:var(--chip)} .mtog[aria-pressed="true"]:hover{color:var(--amber-l)}}
.seg{display:inline-flex;gap:2px;background:var(--tint2);border:1px solid var(--hair);border-radius:9px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:var(--t4);font:700 11px var(--mono);letter-spacing:.10em;padding:6px 10px;border-radius:6px;cursor:pointer;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--amber-10);color:var(--amber)}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.readout{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--tint2);border:1px solid var(--hair);margin-bottom:8px;min-height:52px}
.readout .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t4);flex:1 1 100%;line-height:1}
.readout .v{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1.1}
.readout .p{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.readout .v.pos{color:var(--up)} .readout .v.neg{color:var(--down)}
.readout .p.mkt{color:var(--mkt)} .readout .p .l{font-size:inherit;letter-spacing:0;text-transform:none;color:inherit}
.readout .d{font-family:var(--mono);font-size:11px;color:var(--t4);margin-left:auto}
#chart{min-height:160px;margin:0 -4px}
svg.plot{width:100%;height:auto;display:block;font-family:var(--mono);font-size:11px;touch-action:pan-y;cursor:crosshair}
svg.plot text{fill:var(--t5)}
/* each line's own end value, so the benchmark reads the same on every tab even
   though each tab scales its axis to its own swing */
svg.plot text.endlab{font-weight:700;font-size:10.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--t4);padding:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:0;border-top:2px solid var(--line);border-radius:2px}
.legend i.base{border-top:1px dashed var(--t4)}
.legend i.mkt{width:20px;border-top:2px dashed var(--mkt)}

/* private mode: the unlock bar, and the note that stands in for a hidden list */
.lock{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;margin:18px 0 4px;border-radius:12px;background:var(--sheet);border:1px solid var(--sheet-hair)}
.lock .t{flex:1 1 260px;min-width:0}
.lock b{display:block;font-size:14px;color:var(--t1)}
.lock p{margin:2px 0 0;font-size:12.5px;color:var(--t3);line-height:1.45}
.lock form{display:flex;gap:8px;flex:0 0 auto}
.lock input{font:14px var(--mono);color:var(--t1);background:var(--tint3);border:1px solid var(--hair2);border-radius:9px;padding:9px 12px;width:190px;max-width:46vw}
.lock input:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
.lock button{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--on-amber);background:var(--amber);border:0;border-radius:9px;padding:0 16px;height:38px;cursor:pointer}
.lock button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.lock.bad input{border-color:var(--down)}
.lock .err{flex:1 1 100%;font:11px var(--mono);letter-spacing:.10em;text-transform:uppercase;color:var(--down);margin:0}
.hid{font-family:var(--mono);font-size:12.5px;color:var(--t4);letter-spacing:.06em;padding:10px 0;margin:0}
.relock{display:flex;justify-content:center;padding:28px 0 10px}
.relock button{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--t5);background:none;border:0;cursor:pointer;padding:8px 12px;border-radius:8px}
.relock button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
@media (hover:hover){.relock button:hover{color:var(--t3)}}
.legend i.now{width:7px;height:7px;border:0;border-radius:50%;background:var(--amber)}

/* tables (wide) */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:right;padding:0 10px;height:48px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);font-weight:400;height:36px}
td:first-child,th:first-child{text-align:left;padding-left:0} td:last-child,th:last-child{padding-right:0}
td{font-family:var(--mono);color:var(--t2)}
td:first-child{font-family:var(--sans);font-weight:700;color:var(--t1)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font:700 10.5px var(--mono);letter-spacing:.10em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.pill.dip{color:var(--dip);background:var(--dip-10)} .pill.mom{color:var(--mom);background:var(--mom-10)}
.pill.warn{color:var(--amber);background:var(--amber-10)} .pill.dim{color:var(--t4);background:var(--tint3)}
.note{font-size:12.5px;color:var(--t4);margin:10px 0 0}
td.why{font-family:var(--sans);color:var(--t3);white-space:normal;max-width:260px;text-align:left;padding-left:16px;line-height:1.3}
.row .why{font-size:12.5px;color:var(--t3)}

/* row list (phones): one row per position */
.rows{display:none}
.row{padding:12px 0;border-bottom:1px solid var(--hair);display:grid;gap:7px}
.row:last-child{border-bottom:0;padding-bottom:4px}
.row .a{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .a b{font-size:15px;color:var(--t1)}
.row .a .num{font-size:15px;font-weight:700}
.row .b{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--t3)}
.row .b .num{color:var(--t2)}
.row .f{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t4)}
.row .f .warn{color:var(--amber)}

/* news: one group per name, newest first; every headline links out */
.val.word{font-size:clamp(30px,6vw,44px);letter-spacing:-.03em}
.ng{padding:14px 0;border-bottom:1px solid var(--hair)} .ng:first-child{padding-top:0} .ng:last-child{border-bottom:0;padding-bottom:0}
.ng-h{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:6px;flex-wrap:wrap}
.ng-h b{font-size:15px}
.ni{padding:8px 0 8px 14px;border-left:2px solid var(--hair2);margin:6px 0}
.ni-m{display:flex;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);margin-bottom:3px}
/* a source that ships a whole lede as its title should not swamp the group */
.ni-t{color:var(--t1);text-decoration:none;font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
a.ni-t::after{content:" ↗";color:var(--t4);font-weight:400}
.ni-s{font-size:12.5px;color:var(--t3);margin:4px 0 0;line-height:1.45}
@media (hover:hover){a.ni-t:hover{color:var(--amber)}}
/* the feed is long; its sheet keeps pace with it instead of leaving a dead column */
@media (min-width:820px){body[data-tab="news"] .sheet{position:sticky;top:63px}}

/* the sheet: the one warm object on the page. dark now, so it no longer glares */
.sheet{background:radial-gradient(120% 90% at 100% 0%,var(--amber-08),transparent 55%),var(--sheet);border:1px solid var(--sheet-hair);border-radius:12px;padding:18px 20px;font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--t2);align-self:start}
.sheet .h{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.sheet .h span:last-child{color:var(--t4)}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.sheet dt{color:var(--t4)} .sheet dd{margin:0;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.sheet dd.pos{color:var(--up)} .sheet dd.neg{color:var(--down)}
.sheet .line{border-top:1px solid var(--sheet-hair);margin:12px 0}
.sheet .ev{display:grid;grid-template-columns:auto 1fr;gap:5px 14px}
.sheet .ev .done{color:var(--t5);text-decoration:line-through}
.sheet .ev .next{color:var(--amber);font-weight:700;position:relative}
.sheet .ev .next.t::before{content:"";position:absolute;left:-12px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 2.4s ease-in-out infinite}
.sheet .ev{padding-left:12px}
.sheet .foot{font-size:11px;color:var(--t4);line-height:1.5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sheet .ev .next.t::before{animation:none}}

@media (hover:hover){
  .tabs button:not([aria-selected="true"]):hover{color:var(--t2)}
  .seg button:not([aria-pressed="true"]):hover{color:var(--t2)}
}

/* phones */
@media (max-width:640px){
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs .wrap{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabs button{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:8px 4px 7px;min-height:var(--nav-h);border-bottom:0;border-top:2px solid transparent;margin:-1px 0 0;font-size:10.5px;letter-spacing:.06em}
  .tabs button svg{display:block}
  .tabs button .l{display:none} .tabs button .s{display:inline}
  .tabs button[aria-selected="true"]{border-top-color:var(--amber);background:linear-gradient(0deg,transparent,var(--amber-08))}
  .app{padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}

}
@media (max-width:560px){
  .brand h1{font-size:18px}

  .delta{font-size:13px;padding:6px 10px} .regime{font-size:10.5px;padding:6px 10px}

}

<body>
<header class="rail">
  <div class="wrap">
    <div class="brand"><div class="mark" aria-hidden="true"></div><h1>Dashboardia</h1><span class="envb" id="envb" hidden></span></div>
    <div class="stamp" id="stamp"><span class="dot warn"></span>loading…</div>
  </div>
</header>
<nav class="tabs">
  <div class="wrap" role="tablist" id="tabs">
    <button role="tab" data-tab="bot" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M10 9v6M14 9v6"/></svg><span class="l">BOT</span><span class="s">BOT</span></button>
    <button role="tab" data-tab="rest" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span class="l">REST OF PORTFOLIO</span><span class="s">REST</span></button>
    <button role="tab" data-tab="total" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg><span class="l">TOTAL</span><span class="s">TOTAL</span></button>
    <button role="tab" data-tab="news" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14H4z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7 9h7M7 12h7M7 15h4"/></svg><span class="l">NEWS</span><span class="s">NEWS</span></button>
  </div>
</nav>
<main class="app">
  <div class="wrap">
    <div class="err" id="err"></div>
    <section id="view"><p class="note" style="padding:28px 0">Loading the latest snapshot…</p></section>
  </div>
</main>

<script>
(function(){
const $=s=>document.querySelector(s);
const fmt$=v=>(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtP=v=>{const s=v.toFixed(2); return (s==='0.00'||s==='-0.00')?'0.00%':(v>0?'+':'')+s+'%'};
const cls=v=>v>0.005?'pos':v<-0.005?'neg':'';
const dir=v=>v>0.005?'up':v<-0.005?'down':'flat';
const dmy=s=>new Date(s+(s.length===10?'T12:00:00':'')).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase();
const dmyhm=d=>d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).replace(',','').toUpperCase();
const ARROW='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2 9 8H1z" fill="currentColor"/></svg>';
const ARROW_DN='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 8 1 2h8z" fill="currentColor"/></svg>';
// Headlines are third-party text, so they are escaped before they touch the DOM.
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>/^https?:\/\//i.test(s||'')?esc(s):'';
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
const NS='http://www.w3.org/2000/svg';
const el=(n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e};
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
const JOBS=[['08:30','Morning check'],['09:31','Opening prices'],['09:44','Momentum buying'],['10:14','Dip buying'],['14:00','Dip selling'],['15:54','Momentum selling'],['16:30','End of day']];
// ---- private mode --------------------------------------------------------
// A CURTAIN, NOT A LOCK. This keeps the figures off the screen for whoever opens
// the link, and that is all it does. latest.json, history.json and news.json sit
// beside this file on the same public host, and anyone who asks for one of them
// by name still gets it whole. Real secrecy needs the bot to encrypt those files
// before it uploads them; the README says what that would take.
const PASS_SHA='1b750a85db4c8b9489b07996e43e47e3d2b26e922cab1b1da3d9ee666fbc3ede';
let locked=true, badPass=false, pass='', encrypted=false;
try{pass=localStorage.getItem('db.pw')||''}catch(e){}
try{locked=localStorage.getItem('db.key')!==PASS_SHA}catch(e){}
const sha256=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};

// ---- decryption ----------------------------------------------------------
// Once the bot encrypts what it uploads, the files on the host are ciphertext and
// this is the only way in: the key is derived from the password, never shipped.
// The page reads plaintext too, so nothing breaks on the way there.
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const isEnc=o=>!!o&&typeof o==='object'&&o.enc==='AES-GCM'&&o.ct&&o.iv&&o.salt;
const KEYS=new Map();
async function deriveKey(pw,salt,iter){
  const ck=salt+'|'+iter;
  if(KEYS.has(ck)) return KEYS.get(ck);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  KEYS.set(ck,k); return k;
}
// throws on a wrong password: AES-GCM authenticates, so the data itself is the check
async function open_(doc,pw){
  if(!isEnc(doc)) return doc;
  const k=await deriveKey(pw,doc.salt,doc.iter||200000);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(doc.iv)},k,b64(doc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const fnv=s=>{let h=0x811c9dc5;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),0x01000193)>>>0;return h};
// deterministic, so a figure garbles the same way on every render and the page
// does not flicker through fresh nonsense every sixty seconds
const garble=s=>{let h=fnv(s);return s.replace(/\d/g,()=>{h=Math.imul(h^0x2545f491,0x01000193)>>>0;return String(h%10)})};
// Controls, field labels, the benchmark's own name and the time axis keep their
// digits: scrambling those breaks the furniture without hiding anything worth
// hiding. Only figures are scrambled.
const NOG='.seg,.mtog,.k,small,.xlab,.l';
function curtain(root){
  const skip=new Set(root.querySelectorAll?root.querySelectorAll(NOG):[]);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), hits=[];
  let n; while(n=w.nextNode()){
    if(!/\d/.test(n.nodeValue)) continue;
    let p=n.parentNode, ok=true;
    while(p&&p!==root){ if(skip.has(p)){ok=false;break} p=p.parentNode }
    if(ok) hits.push(n);
  }
  hits.forEach(t=>{t.nodeValue=garble(t.nodeValue)});
}
// lists carry names and headlines, which no amount of digit-scrambling hides
const hidden=what=>`<p class="hid">${what} — hidden until unlocked.</p>`;
const lockBar=()=>locked?`<div class="lock${badPass?' bad':''}"><div class="t"><b>${encrypted?'Encrypted':'Private dashboard'}</b>
  <p>${encrypted
    ?'The data for this page is encrypted. Without the password there is nothing here to read — not on the screen, and not in the files behind it.'
    :'Every figure below is scrambled. Enter the password to see the real ones. Until the bot encrypts what it uploads, this hides the page but not the files behind it.'}</p></div>
  <form id="unlock"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button type="submit">Unlock</button></form>
  ${badPass?'<p class="err">That is not the password.</p>':''}</div>`:'';

let latest=null, hist=null, news=null, tab='bot', range='ALL', vsOn=false;
try{tab=localStorage.getItem('db.tab')||tab;range=localStorage.getItem('db.range')||range;vsOn=localStorage.getItem('db.vs')==='1'}catch(e){}

async function load(){
  // all three at once: the lock decision has to see news.json too. Two
  // independent processes publish these, so a failed snapshot upload beside a
  // successful news upload can convert news first - and an empty news tab
  // instead of a password prompt would just look broken.
  const q='?ts='+Date.now(); let ra,rb,rc=null,newsCode=0;
  try{
    const [a,b,c]=await Promise.all([
      fetch('latest.json'+q,{cache:'no-store'}),
      fetch('history.json'+q,{cache:'no-store'}),
      fetch('news.json'+q,{cache:'no-store'}).catch(()=>null)]);
    if(!a.ok||!b.ok) throw new Error('HTTP '+a.status+'/'+b.status);
    ra=await a.json(); rb=await b.json();
    if(c){newsCode=c.status; if(c.ok){try{rc=await c.json()}catch(e){rc=null}}}
    $('#err').style.display='none';
  }catch(e){
    $('#err').textContent='Could not load data: '+e.message+(latest?' — showing the last good copy.':'');
    $('#err').style.display='block';
    return latest?render():undefined;
  }
  encrypted=isEnc(ra)||isEnc(rb)||isEnc(rc);
  if(encrypted&&!pass){latest=hist=news=null;locked=true;return render()}
  try{
    // both together: decrypting takes real time, and a tab click landing between
    // the two assignments would draw a hero with no curve under it
    const [L,H]=await Promise.all([open_(ra,pass),open_(rb,pass)]);
    latest=L; hist=H;
    if(encrypted) locked=false;           // holding the key IS the unlock
  }catch(e){                               // a wrong password fails the GCM tag
    latest=hist=news=null; locked=true; pass=''; try{localStorage.removeItem('db.pw')}catch(_){}
    return render();
  }
  // news is optional and never fatal; a transient failure keeps the last copy
  // rather than blanking the tab, but a clean 404 means it is genuinely gone
  if(rc){try{news=await open_(rc,pass)}catch(e){}}
  else if(newsCode===404) news=null;
  render();
}

function etNow(){ // wall clock in New York from the snapshot's offset
  const m=/([+-]\d\d):(\d\d)$/.exec(latest.generated_at); const off=m?(parseInt(m[1])*60+Math.sign(parseInt(m[1]))*parseInt(m[2])):-240;
  return new Date(Date.now()+off*60000);
}
// The snapshot task runs 06:00-18:00 New York. Outside that window the data is
// meant to stop, so overnight staleness is shown as a pause, not a fault.
const WINDOW=[6*60,18*60];
function stamp(){
  const t=new Date(latest.generated_at); const mins=Math.round((Date.now()-t)/60000);
  const hm=t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), day=t.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  const ny=etNow(), nyMin=ny.getUTCHours()*60+ny.getUTCMinutes();
  const off=nyMin<WINDOW[0]||nyMin>=WINDOW[1];
  // inside the window, staleness only counts from the moment the window opened
  const stale=Math.max(0,Math.min(mins,nyMin-WINDOW[0]));
  const age=off?'paused<span class="till"> until 06:00 ET</span>':stale<1?'just now':stale<60?stale+' min ago':Math.round(stale/60)+' h ago';
  const dot=off?'off':stale>120?'bad':stale>20?'warn':'';
  $('#stamp').innerHTML='<span class="dot '+dot+'"></span><span class="lbl">UPDATED </span><b>'+hm+'<span class="day"> '+day+'</span></b> · '+age;
  const e=$('#envb'); if(latest.env){e.textContent=latest.env; e.className='envb'+(latest.env==='virtual'?'':' live'); e.hidden=false} else e.hidden=true;
}

function series(){
  const key=tab; const rows=(hist&&hist.rows)||[];
  const now=Date.now(); const span={'1D':1,'1W':7,'1M':31,'ALL':1e6}[range]*864e5;
  const pt=r=>({t:new Date(r.t),v:r[key],p:r[key+'_pct'],m:typeof r.spy==='number'?r.spy:null});
  let pts=rows.filter(r=>now-new Date(r.t)<=span).map(pt);
  if(pts.length<2&&rows.length) pts=rows.slice(-Math.min(rows.length,2)).map(pt);
  if(pts.length>600){const step=pts.length/600;pts=pts.filter((_,i)=>Math.floor(i%step)===0||i===pts.length-1)}
  return pts;
}

// THE BENCHMARK. Both curves are rebased to zero at the first instant where this
// tab and the market are BOTH known - not at the edge of the range - so a gap in
// the market data cannot flatter either side, and the distance between the two
// lines is a true like-for-like figure. Returns null until the bot ships `spy`,
// which is what keeps the toggle and the chip hidden rather than broken.
const MARKET='S&P 500';
function marketView(pts){
  const i=pts.findIndex(p=>p.m!=null&&p.v!=null&&p.m>0&&p.v>0);
  if(i<0) return null;
  const v0=pts[i].v, m0=pts[i].m, rest=pts.slice(i);
  const you=rest.filter(p=>p.v!=null).map(p=>({t:p.t,v:(p.v/v0-1)*100}));
  const mkt=rest.filter(p=>p.m!=null).map(p=>({t:p.t,v:(p.m/m0-1)*100}));
  if(you.length<2||mkt.length<2) return null;
  const yl=you[you.length-1].v, ml=mkt[mkt.length-1].v;
  return {you,mkt,from:rest[0].t,you_pct:yl,mkt_pct:ml,gap:yl-ml};
}
// The always-on figure. Same range as the chart, so nothing on screen describes
// a window other than the one being looked at.
function vsChip(){
  const v=marketView(series()); if(!v) return '';
  // names the real basis: on BOT "all time" already means the stake, and this
  // comparison starts at the first snapshot instead
  const k=dir(v.gap), lab=range==='ALL'?'since '+dmy(v.from):range;
  return `<div class="chip ${k}"><span class="k">vs ${MARKET}</span>${k==='down'?ARROW_DN:ARROW}<span class="n ${cls(v.gap)}">${fmtP(v.gap)}</span><small>${lab}</small></div>`;
}

// Drawn at the width it is shown at, so its type stays 11px on a phone.
// Scrubbing writes into the readout row above the plot rather than a floating
// tooltip, which a thumb would cover.
function chart(pts,W,onPoint,mv){
  // against the benchmark the right margin widens into a gutter for the end labels
  const narrow=W<480, H=narrow?210:300, R=mv?(narrow?46:54):12, T=14, B=26;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':mv?'This tab and the market, both measured from zero':'Value over time',class:'plot'});
  const prim=mv?mv.you:pts;
  if(prim.length<2){
    svg.appendChild(el('text',{x:W/2,y:H/2-6,'text-anchor':'middle'},'NOT ENOUGH HISTORY YET'));
    svg.appendChild(el('text',{x:W/2,y:H/2+12,'text-anchor':'middle'},'THE CURVE STARTS WITH THE NEXT SNAPSHOTS'));
    return svg;
  }
  const vs=mv?mv.you.map(p=>p.v).concat(mv.mkt.map(p=>p.v)):pts.map(p=>p.v);
  let lo=Math.min(...vs), hi=Math.max(...vs); if(hi-lo<1e-9){lo-=1;hi+=1}
  const pad=(hi-lo)*0.10; lo-=pad; hi+=pad;
  const dec=mv?((hi-lo)<2?2:1):((hi-lo)<8?2:0);
  const ylab=mv?(v=>(v>0?'+':'')+v.toFixed(dec)+'%')
               :(v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}));
  const ylabs=[0,1,2,3,4].map(i=>ylab(lo+(hi-lo)*i/4));
  const L=12+Math.max(...ylabs.map(s=>s.length))*6.7;
  const t0=(mv?mv.from:pts[0].t).getTime();
  const t1=(mv?Math.max(mv.you[mv.you.length-1].t.getTime(),mv.mkt[mv.mkt.length-1].t.getTime())
             :pts[pts.length-1].t.getTime())||t0+1;
  const x=t=>L+(t-t0)/(t1-t0||1)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const defs=el('defs',{}); const gid='area'+Math.random().toString(36).slice(2,7);
  const g=el('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1});
  g.appendChild(el('stop',{offset:'0%','stop-color':css('--line'),'stop-opacity':.22}));
  g.appendChild(el('stop',{offset:'100%','stop-color':css('--line'),'stop-opacity':0}));
  defs.appendChild(g); svg.appendChild(defs);
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4; svg.appendChild(el('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:css('--hair2'),'stroke-width':1}));
    svg.appendChild(el('text',{x:L-8,y:y(v)+4,'text-anchor':'end'},ylabs[i]))}
  const span=t1-t0, xt=Math.min(narrow?3:5,pts.length-1);
  for(let i=0;i<=xt;i++){const t=t0+span*i/xt; const d=new Date(t);
    // a range under a day is labelled by time, a few days by date and time, longer by date alone
    const lab=span>3*864e5?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase():span>864e5?dmyhm(d):d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    svg.appendChild(el('text',{x:x(t),y:H-8,'text-anchor':i===0?'start':i===xt?'end':'middle',class:'xlab'},lab))}
  // in benchmark mode the baseline IS the shared zero both curves start from
  const base=mv?0:pts[0].v; svg.appendChild(el('line',{x1:L,x2:W-R,y1:y(base),y2:y(base),stroke:css('--t4'),'stroke-width':1,'stroke-dasharray':'3 4'}));
  const line=a=>'M'+a.map(p=>x(p.t.getTime()).toFixed(1)+','+y(p.v).toFixed(1)).join(' L');
  const d=line(prim);
  // no area fill against a benchmark - two washes of colour would muddy the one
  // thing the view exists to show, which is the distance between the lines
  if(!mv) svg.appendChild(el('path',{d:d+` L${x(t1).toFixed(1)},${y(lo)} L${x(t0).toFixed(1)},${y(lo)} Z`,fill:`url(#${gid})`}));
  if(mv) svg.appendChild(el('path',{d:line(mv.mkt),fill:'none',stroke:css('--mkt'),'stroke-width':1.5,'stroke-dasharray':'5 4','stroke-linejoin':'round','stroke-linecap':'round'}));
  svg.appendChild(el('path',{d,fill:'none',stroke:css('--line'),'stroke-width':mv?2.6:2,'stroke-linejoin':'round','stroke-linecap':'round',style:'filter:drop-shadow(0 0 6px '+css('--glow')+')'}));
  const last=prim[prim.length-1]; svg.appendChild(el('circle',{cx:x(last.t.getTime()),cy:y(last.v),r:4.5,fill:css('--amber'),stroke:css('--panel'),'stroke-width':2}));
  if(mv){ // the number beside each line, nudged apart when the two ends nearly touch
    const ml=mv.mkt[mv.mkt.length-1], clamp=v=>Math.max(T+8,Math.min(H-B-2,y(v)));
    let ya=clamp(last.v), yb=clamp(ml.v);
    if(Math.abs(ya-yb)<12){const up=ya<=yb?-1:1; ya+=up*6; yb-=up*6}
    const tag=(yy,v,col)=>svg.appendChild(el('text',{x:W-R+6,y:yy+3.5,'text-anchor':'start',class:'endlab',fill:col},(v>0?'+':'')+v.toFixed(2)+'%'));
    tag(yb,ml.v,css('--mkt')); tag(ya,last.v,css('--line'));
  }
  const vline=el('line',{y1:T,y2:H-B,stroke:css('--t3'),'stroke-width':1,'stroke-dasharray':'2 3',visibility:'hidden'}); const dot=el('circle',{r:4.5,fill:css('--amber'),stroke:css('--panel'),'stroke-width':2,visibility:'hidden'});
  svg.appendChild(vline); svg.appendChild(dot);
  const hit=el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'transparent'}); svg.appendChild(hit);
  const show=ev=>{const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width*W; const tt=t0+(px-L)/(W-L-R)*(t1-t0);
    let best=prim[0],bd=1e18; for(const p of prim){const dd=Math.abs(p.t.getTime()-tt); if(dd<bd){bd=dd;best=p}}
    const cx=x(best.t.getTime()),cy=y(best.v); vline.setAttribute('x1',cx);vline.setAttribute('x2',cx);vline.setAttribute('visibility','visible');
    dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('visibility','visible');
    if(!mv) return onPoint(best);
    let bm=null,md=1e18; for(const p of mv.mkt){const dd=Math.abs(p.t.getTime()-best.t.getTime()); if(dd<md){md=dd;bm=p}}
    onPoint({t:best.t,v:best.v,m:bm?bm.v:null,pct:true})};
  const hide=()=>{vline.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden');onPoint(null)};
  hit.addEventListener('pointerdown',show); hit.addEventListener('pointermove',show);
  hit.addEventListener('pointerleave',hide); hit.addEventListener('pointercancel',hide); hit.addEventListener('pointerup',hide);
  return svg;
}

// the scrub rewrites the readout on every pointer move, so the curtain is
// re-applied here rather than once at render
function readout(p){ readoutRaw(p); if(locked){const r=$('#readout'); if(r) curtain(r)} }
function readoutRaw(p){
  const ro=$('#readout'); if(!ro||!latest) return;
  const pts=series(), mv=vsOn?marketView(pts):null;
  if(mv){ // against the benchmark the readout carries both curves and the gap
    const yl=mv.you[mv.you.length-1], ml=mv.mkt[mv.mkt.length-1];
    const q=(p&&p.pct)?p:{t:yl.t,v:yl.v,m:ml.v};
    ro.querySelector('.l').textContent=(p?'':'LATEST · ')+dmyhm(q.t);
    const ve=ro.querySelector('.v'); ve.textContent=fmtP(q.v); ve.className='v '+cls(q.v);
    const pe=ro.querySelector('.p'); pe.innerHTML=`<span class="l">${MARKET}</span> `+(q.m==null?'—':fmtP(q.m)); pe.className='p mkt';
    const gap=q.m==null?null:q.v-q.m;
    ro.querySelector('.d').textContent=gap==null?'':(gap>=0?'ahead by ':'behind by ')+Math.abs(gap).toFixed(2)+'%';
    return;
  }
  const last=pts[pts.length-1]; const q=(p&&!p.pct)?p:last; if(!q) return;
  ro.querySelector('.l').textContent=(p?'':'LATEST · ')+dmyhm(q.t);
  const ve=ro.querySelector('.v'); ve.textContent=fmt$(q.v); ve.className='v';
  const pe=ro.querySelector('.p'); pe.textContent=fmtP(q.p); pe.className='p '+cls(q.p);
  ro.querySelector('.d').textContent=p?'':(tab==='bot'?'vs stake':'vs first snapshot');
}

let chartW=0, ro=null;
function drawChart(){
  const box=$('#chart'); if(!box) return;
  chartW=Math.max(260,Math.round(box.clientWidth));
  const pts=series(), mv=vsOn?marketView(pts):null;
  box.replaceChildren(chart(pts,chartW,readout,mv));
  if(locked) curtain(box); // the axis labels carry real figures too
  readout(null);
}
function watchChart(){
  const box=$('#chart'); if(!box) return;
  const check=()=>{const b=$('#chart'); if(b&&Math.round(b.clientWidth)!==chartW) drawChart()};
  if(!('ResizeObserver' in window)){ if(!ro){ro=true; addEventListener('resize',check)} return }
  if(!ro) ro=new ResizeObserver(check);
  ro.disconnect(); ro.observe(box);
}

// [label, value, class, context line, {pct, kind}]
function tiles(items){return '<div class="tiles">'+items.map(([k,v,c,s,m])=>`<div class="tile"><div class="caps">${k}</div><div class="v ${c||''}">${v}</div>${s?`<div class="c">${s}</div>`:''}${m?`<div class="bar ${m.kind||''}" aria-hidden="true"><i style="width:${Math.max(0,Math.min(100,m.pct))}%"></i></div>`:''}</div>`).join('')+'</div>'}
function split(parts){ // [[label, share, colour var]]
  return `<div class="bar split" aria-hidden="true">${parts.map(p=>`<i style="flex:${Math.max(p[1],0.4)} 0 0;background:var(--${p[2]})"></i>`).join('')}</div>
  <div class="legend" style="padding-top:10px">${parts.map(p=>`<span><i class="now" style="background:var(--${p[2]})"></i>${p[0]} ${p[1].toFixed(1)}%</span>`).join('')}</div>`;
}
function chartCard(title,subtitle){
  const ranges=['1D','1W','1M','ALL'].map(k=>`<button aria-pressed="${k===range}" data-r="${k}">${k}</button>`).join('');
  // the toggle only exists once the bot ships a benchmark to toggle to
  const mv=marketView(series()), on=vsOn&&mv;
  const tog=mv?`<button class="mtog" id="mtog" aria-pressed="${vsOn?'true':'false'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16l5-5 4 3 9-9"/><path d="M3 21l5-3 4 1 9-4" opacity=".5"/></svg>vs Market</button>`:'';
  // a tab that is mostly cash will trail the market by construction, so it says so
  // rather than letting the gap read as bad picking
  let cash=0;
  if(on&&tab!=='bot'){const o=tab==='rest'?latest.rest:latest.total; cash=o.value?o.cash/o.value*100:0}
  const sub=on?`Both lines start at zero on <span class="l">${dmyhm(mv.from)}</span>. The distance between them is the whole story.`
    +(cash>50?` This tab is ${cash.toFixed(0)}% cash, which does not follow the market either way.`:'')
    :subtitle;
  const legend=on
    ?`<div class="legend"><span><i></i>${title.toLowerCase()}</span><span><i class="mkt"></i>${MARKET} (SPY)</span><span><i class="base"></i>shared zero</span><span><i class="now"></i>latest</span></div>`
    :`<div class="legend"><span><i></i>value</span><span><i class="base"></i>start of range</span><span><i class="now"></i>latest</span></div>`;
  return `<div class="card chartbox"><div class="card-h"><div><h2 class="title">${title}</h2><p class="subtitle">${sub}</p></div><div class="ctrl">${tog}<div class="seg" role="group" aria-label="Range">${ranges}</div></div></div>
  <div class="readout" id="readout"><span class="l">—</span><span class="v">—</span><span class="p">—</span><span class="d"></span></div><div id="chart"></div>
  ${legend}</div>`;
}

// The wall-clock time written inside an ET timestamp, e.g. "13:49" - the bot's
// own clock, not the viewer's.
const etHM=s=>(typeof s==='string'&&s.length>=16)?s.slice(11,16):'';
// Read the date out of an ET timestamp the same way - the market's own calendar,
// so an 8pm New York headline never shows up dated tomorrow.
const etDMY=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||''); return m?dmy(m[0]):''};
const breakerText=k=>{ // one line for the Dip book's circuit breaker
  if(!k) return 'armed'; if(k.peak==null) return 'armed · no Dip session yet';
  if(k.paused_sessions) return `PAUSED · ${k.paused_sessions} sessions`;
  return `armed · ${k.drawdown_pct==null?'':fmtP(k.drawdown_pct)+' off peak'}`;
};

// The bot's day in New York time: what has run, what is next.
function daySheet(){
  const b=latest.bot, now=etNow(); const hm=now.getUTCHours()*60+now.getUTCMinutes();
  const rg={up:'RISING',side:'FLAT',down:'FALLING'}[latest.regime]||'—';
  const bk=b.books, dy=b.day;
  const nextIdx=JOBS.findIndex(([t])=>parseInt(t.slice(0,2))*60+parseInt(t.slice(3))>=hm);
  const ev=JOBS.map(([t,n],i)=>{const m=parseInt(t.slice(0,2))*60+parseInt(t.slice(3)); const k=m<hm?'done':i===nextIdx?'next':''; return `<span class="${k} t">${t}</span><span class="${k}">${n}</span>`}).join('');
  const clock=String(now.getUTCHours()).padStart(2,'0')+':'+String(now.getUTCMinutes()).padStart(2,'0');
  const today=dy&&dy.pnl!=null?`<dt>Today</dt><dd class="${cls(dy.pnl)}">${fmt$(dy.pnl)} · ${fmtP(dy.pct)}</dd>`:'';
  const basis=dy&&dy.basis?`Today runs from the first snapshot of the day, ${etHM(dy.basis)} ET (${dy.snapshots} so far), not from the open.`:'';
  return `<div class="sheet"><div class="h"><span>Day sheet</span><span>${new Date(latest.generated_at).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase()}</span></div>
  <dl><dt>Market</dt><dd>${rg}</dd>${today}<dt>Dip book</dt><dd>${bk.B.open}/${bk.B.slots} slots · ${latest.regime==='up'?'may buy':'stands down'}</dd><dt>Momentum</dt><dd>${bk.C.open}/${bk.C.slots} slots · ${latest.regime==='down'?'holds cash':bk.C.open>=bk.C.slots?'full':'may buy'}</dd>
  <dt>Breaker</dt><dd>${breakerText(b.breaker)}</dd></dl>
  <div class="line"></div><div class="ev">${ev}</div>
  <div class="line"></div><div class="foot">NEW YORK ${clock} · ${nextIdx<0?'session complete':'next: '+JOBS[nextIdx][1].toLowerCase()}${basis?'<br>'+basis:''}</div></div>`;
}

// Closed trades. Cancelled orders never enter this list - the bot keeps them
// out and reports them as closed_stats.cancelled_orders.
function closedTrades(b){
  const cl=b.closed||[], st=b.closed_stats||{}, n=st.trades||0;
  const cancelled=st.cancelled_orders?`<p class="note">${st.cancelled_orders} order${st.cancelled_orders===1?' was':'s were'} placed but never filled and ${st.cancelled_orders===1?'was':'were'} cancelled - not a trade, not counted.</p>`:'';
  if(!n) return `<p class="note">No trades closed yet. Realised P&amp;L stays at ${fmt$(0)} until one does.</p>${cancelled}`;
  const book=p=>`<span class="pill ${p.book==='B'?'dip':'mom'}">${p.book==='B'?'Dip':'Mom'}</span>`;
  const won=`${st.wins} won · ${st.losses} lost`+(st.flat?` · ${st.flat} flat`:'');
  const stats=tiles([
    ['Win rate',st.win_rate==null?'—':st.win_rate.toFixed(0)+'%','',won,{pct:st.win_rate||0}],
    ['Net P&amp;L',st.net_pnl==null?'—':fmt$(st.net_pnl),cls(st.net_pnl||0),`${n} trade${n===1?'':'s'}, after commission`],
    ['Average win',st.avg_win==null?'—':fmt$(st.avg_win),st.avg_win==null?'':'pos',st.wins?`over ${st.wins} winner${st.wins===1?'':'s'}`:'no winners yet'],
    ['Average loss',st.avg_loss==null?'—':fmt$(st.avg_loss),st.avg_loss==null?'':'neg',st.losses?`over ${st.losses} loser${st.losses===1?'':'s'}`:'no losers yet'],
    ['Average hold',st.avg_hold_sessions==null?'—':st.avg_hold_sessions.toFixed(1)+' days','','trading days'],
    ['Best · worst',`${st.best||'—'} · ${st.worst||'—'}`,'','by P&amp;L']
  ]);
  const tr=cl.map(p=>`<tr><td>${p.symbol}${book(p)}</td><td>${dmy(p.opened)} → ${dmy(p.closed)}</td><td>${p.entry.toFixed(2)} → ${p.exit.toFixed(2)}</td><td class="${cls(p.pct)}">${fmtP(p.pct)}</td><td class="${cls(p.pnl)}">${fmt$(p.pnl)}</td><td>${p.sessions_held}</td><td class="why">${p.reason_text||p.reason||''}</td></tr>`).join('');
  const rows=cl.map(p=>`<div class="row"><div class="a"><span><b>${p.symbol}</b>${book(p)}</span><span class="num ${cls(p.pnl)}">${fmt$(p.pnl)}</span></div>
    <div class="b"><span class="num">${p.entry.toFixed(2)} → ${p.exit.toFixed(2)}</span><span class="num ${cls(p.pct)}">${fmtP(p.pct)}</span></div>
    <div class="f"><span>${dmy(p.opened)} → ${dmy(p.closed)} · ${p.sessions_held} days</span></div><div class="why">${p.reason_text||p.reason||''}</div></div>`).join('');
  return `${stats}<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Position</th><th>Opened → closed</th><th>Entry → exit</th><th>Chg</th><th>P&amp;L</th><th>Days</th><th>Exit</th></tr></thead><tbody>${tr}</tbody></table></div><div class="rows" style="margin-top:6px">${rows}</div>
  <p class="note">Chg is net of both $1 commissions over the money committed, so it is always a little worse than the price move - it answers what the trade did to the account. Days are trading days.</p>${cancelled}`;
}
// What the Rest and Total deltas are measured from.
function baseSheet(value,p0,foot){
  const m=hist&&hist.meta, rows=(hist&&hist.rows)||[], d=value-p0;
  return `<div class="sheet"><div class="h"><span>Baseline</span><span>${m?'SINCE '+dmy(m.started):''}</span></div>
  <dl><dt>First snapshot</dt><dd>${m?dmyhm(new Date(m.started)):'—'}</dd><dt>Started at</dt><dd>${fmt$(p0)}</dd><dt>Now</dt><dd>${fmt$(value)}</dd><dt>Change</dt><dd class="${cls(d)}">${fmt$(d)} · ${fmtP(p0?d/p0*100:0)}</dd></dl>
  <div class="line"></div><dl><dt>Snapshots</dt><dd>${rows.length}</dd><dt>Account</dt><dd>${latest.env||'—'}</dd></dl>
  <div class="line"></div><div class="foot">${foot}</div></div>`;
}

function botPositions(ps){
  if(!ps.length) return '<p class="note">No open positions. The books are in cash.</p>';
  const book=p=>`<span class="pill ${p.book==='B'?'dip':'mom'}">${p.book==='B'?'Dip':'Mom'}</span>`;
  const flags=p=>{const near=p.stop_distance_pct!=null&&p.stop_distance_pct<2, left=p.time_stop-p.sessions_held;
    return (near?'<span class="pill warn">near stop</span>':'')+(left<=2?'<span class="pill warn">'+left+' left</span>':'')};
  const tr=ps.map(p=>`<tr><td>${p.symbol}${book(p)}${flags(p)}</td><td>${p.entry.toFixed(2)}</td><td>${p.now.toFixed(2)}</td><td class="${cls(p.pct)}">${fmtP(p.pct)}</td><td class="${cls(p.pnl)}">${fmt$(p.pnl)}</td><td>${p.sessions_held}/${p.time_stop}</td><td>${p.stop_distance_pct==null?'—':p.stop_distance_pct.toFixed(1)+'%'}</td></tr>`).join('');
  const rows=ps.map(p=>{const near=p.stop_distance_pct!=null&&p.stop_distance_pct<2, left=p.time_stop-p.sessions_held;
    return `<div class="row"><div class="a"><span><b>${p.symbol}</b>${book(p)}${flags(p)}</span><span class="num ${cls(p.pnl)}">${fmt$(p.pnl)}</span></div>
    <div class="b"><span class="num">${p.entry.toFixed(2)} → ${p.now.toFixed(2)}</span><span class="num ${cls(p.pct)}">${fmtP(p.pct)}</span></div>
    <div class="bar ${p.book==='B'?'dip':'mom'}" aria-hidden="true"><i style="width:${p.sessions_held/p.time_stop*100}%"></i></div>
    <div class="f"><span class="${left<=2?'warn':''}">Day ${p.sessions_held} of ${p.time_stop}</span><span class="${near?'warn':''}">${p.stop_distance_pct==null?'No price stop':p.stop_distance_pct.toFixed(1)+'% above stop'}</span></div></div>`}).join('');
  return `<div class="tablewrap"><table><thead><tr><th>Position</th><th>Entry</th><th>Now</th><th>Chg</th><th>P&amp;L</th><th>Days</th><th>To stop</th></tr></thead><tbody>${tr}</tbody></table></div><div class="rows">${rows}</div>
  <p class="note">Days counts trading days against each book's limit — Dip 12, Momentum 10. "To stop" is the distance above the Momentum book's 5% stop; the Dip book has no price stop by design.</p>`;
}
function restHoldings(r){
  const tag=p=>p.legacy?'<span class="pill dim">pre-bot</span>':'';
  const tr=r.positions.map(p=>`<tr><td>${p.symbol}${tag(p)}</td><td>${dmy(p.opened)} ${p.opened.slice(0,4)}</td><td>${p.entry.toLocaleString('en-US')}</td><td>${p.now.toLocaleString('en-US')}</td><td>${fmt$(p.value)}</td><td class="${cls(p.pct)}">${fmtP(p.pct)}</td><td class="${cls(p.pnl)}">${fmt$(p.pnl)}</td></tr>`).join('')
    +`<tr><td>Cash not used by the bot</td><td></td><td></td><td></td><td>${fmt$(r.cash)}</td><td></td><td></td></tr>`;
  const rows=r.positions.map(p=>`<div class="row"><div class="a"><span><b>${p.symbol}</b>${tag(p)}</span><span class="num">${fmt$(p.value)}</span></div>
    <div class="b"><span class="num">${p.entry.toLocaleString('en-US')} → ${p.now.toLocaleString('en-US')}</span><span class="num ${cls(p.pct)}">${fmtP(p.pct)}</span></div>
    <div class="f"><span>Opened ${dmy(p.opened)} ${p.opened.slice(0,4)}</span><span class="${cls(p.pnl)}">P&amp;L ${fmt$(p.pnl)}</span></div></div>`).join('')
    +`<div class="row"><div class="a"><span><b>Cash not used by the bot</b></span><span class="num">${fmt$(r.cash)}</span></div></div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Position</th><th>Opened</th><th>Entry</th><th>Now</th><th>Value</th><th>Chg</th><th>P&amp;L</th></tr></thead><tbody>${tr}</tbody></table></div><div class="rows">${rows}</div>`;
}

// Chips read context first, then the benchmark, then the headline delta last and
// filled - the same order and the same anatomy (label, arrow, number) on every tab.
function hero(value,sub,d,pct,extra,label){
  const k=Math.abs(pct)<0.005?'flat':dir(d); // a dollar or two on a $96k account is flat, not down
  return `<div class="hero"><div><div class="val">${fmt$(value)}</div><div class="sub">${sub}</div></div>
  <div class="chips">${extra||''}<div class="delta ${k}">${label?`<span class="k">${label}</span>`:''}${k==='down'?ARROW_DN:ARROW}<span>${fmt$(d)} · ${fmtP(pct)}</span></div></div></div>`;
}
const card=(title,subtitle,inner,badge)=>`<div class="card"><div class="card-h"><div><h2 class="title">${title}</h2><p class="subtitle">${subtitle}</p></div>${badge?`<span class="badge">${badge}</span>`:''}</div>${inner}</div>`;

// NEWS. The bot gathers headlines for the names it holds and publishes news.json;
// the page groups them by position so a headline sits next to the money it moves.
function newsItems(){return (news&&Array.isArray(news.items))?news.items.filter(i=>i&&i.symbol&&i.title):[]}
function newsItem(i){
  const u=safeUrl(i.url), d=etDMY(i.published), h=etHM(i.published);
  return `<div class="ni"><div class="ni-m"><span>${d&&h?d+' '+h+' ET':''}</span><span>${esc(i.source||host(i.url))}</span></div>
  ${u?`<a class="ni-t" href="${u}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>`:`<span class="ni-t">${esc(i.title)}</span>`}
  ${i.summary?`<p class="ni-s">${esc(i.summary)}</p>`:''}</div>`;
}
function newsFeed(){
  const b=latest.bot, r=latest.rest, items=newsItems();
  const by={}; items.forEach(i=>{(by[i.symbol]=by[i.symbol]||[]).push(i)});
  Object.values(by).forEach(a=>a.sort((x,y)=>new Date(y.published||0)-new Date(x.published||0)));
  const held=b.positions.map(p=>({s:p.symbol,pill:p.book==='B'?'dip':'mom',lab:p.book==='B'?'Dip':'Mom',ctx:`${fmtP(p.pct)} · held since ${dmy(p.opened)}`,c:cls(p.pct)}));
  const rest=r.positions.map(p=>({s:p.symbol,pill:'dim',lab:'pre-bot',ctx:`${fmtP(p.pct)} · not the bot's`,c:cls(p.pct)}));
  const known=new Set([...held,...rest].map(g=>g.s)), closed=new Set((b.closed||[]).map(p=>p.symbol));
  const other=Object.keys(by).filter(s=>!known.has(s)).map(s=>({s,pill:'dim',lab:closed.has(s)?'closed':'not held',ctx:'',c:''}));
  const groups=[...held,...rest,...other].map(g=>{const a=by[g.s]||[];
    return `<div class="ng"><div class="ng-h"><span><b>${esc(g.s)}</b><span class="pill ${g.pill}">${g.lab}</span></span><span class="caps ${g.c}">${esc(g.ctx)}</span></div>
    ${a.length?a.slice(0,6).map(newsItem).join(''):'<p class="note" style="margin:0">Nothing gathered for this name.</p>'}</div>`}).join('');
  return groups||'<p class="note">No headlines in the feed.</p>';
}
function feedSheet(){
  if(!news) return `<div class="sheet"><div class="h"><span>Feed</span><span>—</span></div><dl><dt>Status</dt><dd>not published</dd><dt>File</dt><dd>news.json</dd></dl>
    <div class="line"></div><div class="foot">The bot gathers headlines when it snapshots and uploads them beside latest.json. This page never fetches news itself, so there is nothing to show until it does.</div></div>`;
  const items=newsItems(), names=new Set(items.map(i=>i.symbol)), src={};
  items.forEach(i=>{const s=i.source||host(i.url)||'unknown'; src[s]=(src[s]||0)+1});
  const top=Object.entries(src).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([s,n])=>`<dt>${esc(s)}</dt><dd>${n}</dd>`).join('');
  const t=new Date(news.generated_at), mins=isNaN(t)?null:Math.round((Date.now()-t)/60000);
  const age=mins==null?'':mins<1?'just now':mins<60?mins+' min ago':Math.round(mins/60)+' h ago';
  return `<div class="sheet"><div class="h"><span>Feed</span><span>${etDMY(news.generated_at)}</span></div>
  <dl><dt>Gathered</dt><dd>${etHM(news.generated_at)||'—'} ET${age?' · '+age:''}</dd><dt>Headlines</dt><dd>${items.length}</dd><dt>Names</dt><dd>${names.size}</dd></dl>
  ${top?`<div class="line"></div><dl>${top}</dl>`:''}
  <div class="line"></div><div class="foot">Gathered by the bot when it snapshots; the page never fetches news itself. Headlines are the sources' own words, not eToro's marks, and nothing here is a signal the bot trades on.</div></div>`;
}

// Every tab has the same shape: hero, chart, [tiles | sheet], then a list if it has one.
function render(){
  document.body.dataset.tab=tab;
  if(!latest){ // encrypted, and no key: there is genuinely nothing to draw
    $('#view').innerHTML=lockBar();
    $('#stamp').innerHTML='<span class="dot off"></span>locked';
    document.title='Dashboardia';
    wireLock(); return;
  }
  stamp();
  const b=latest.bot, r=latest.rest, t=latest.total;
  const since=hist&&hist.meta?dmy(hist.meta.started):'START';
  let head='', body='';
  if(tab==='bot'){
    const d=b.equity-b.stake, bk=b.books, k=b.breaker||{}, dy=b.day;
    const rg={up:'rising',side:'flat',down:'falling'}[latest.regime]||'—';
    // "today" is from the first snapshot of the ET date, which may be well after the open - so the chip says when
    const today=dy&&dy.pnl!=null?`<div class="chip ${dir(dy.pnl)}"><span class="k">Today</span>${dir(dy.pnl)==='down'?ARROW_DN:ARROW}<span class="n ${cls(dy.pnl)}">${fmt$(dy.pnl)} · ${fmtP(dy.pct)}</span><small>from ${etHM(dy.basis)} ET</small></div>`:'';
    head=hero(b.equity,`STAKE ${fmt$(b.stake)} · CASH ${fmt$(b.cash)}`,d,b.pct,`<div class="regime ${latest.regime==='up'?'up':latest.regime==='down'?'down':''}"><span class="dot"></span>Market ${rg}</div>${today}${vsChip()}`,'vs stake');
    const ddPct=k.drawdown_pct!=null&&k.trip_pct?Math.abs(k.drawdown_pct)/Math.abs(k.trip_pct)*100:0;
    const breaker=k.peak==null?['Breaker','armed','','Dip book · no session yet']
      :k.paused_sessions?['Breaker','PAUSED','neg',`Dip book · ${k.paused_sessions} sessions · cooldown ${k.cooldown_sessions}`,{pct:100}]
      :['Breaker',fmtP(k.drawdown_pct)+' off peak',k.drawdown_pct<0?'neg':'',`Dip book · peak ${fmt$(k.peak)} · trips at ${fmtP(k.trip_pct)}`,{pct:ddPct}];
    const books=card('The two books','Each book has its own slots and its own rules.',tiles([
        ['Dip book',fmt$(bk.B.equity),'',`${bk.B.open} of ${bk.B.slots} slots · ${fmt$(bk.B.cash)} cash`,{pct:bk.B.open/bk.B.slots*100,kind:'dip'}],
        ['Momentum book',fmt$(bk.C.equity),'',`${bk.C.open} of ${bk.C.slots} slots · ${fmt$(bk.C.cash)} cash`,{pct:bk.C.open/bk.C.slots*100,kind:'mom'}],
        ['Realised',fmt$(b.realized),cls(b.realized),`${b.closed_trades} closed trade${b.closed_trades===1?'':'s'}`],
        ['Unrealised',fmt$(b.unrealized),cls(b.unrealized),`${b.positions.length} open position${b.positions.length===1?'':'s'}`],
        ['Commission',fmt$(b.fees_paid),'','paid so far'],
        breaker
      ]));
    const nClosed=(b.closed_stats&&b.closed_stats.trades)||0;
    body=`<div class="page">${chartCard('Bot equity',`What the bot's money is worth, against the ${fmt$(b.stake)} stake.`)}
      <div class="two">${books}${daySheet()}</div>
      ${card('Open positions','Live marks from eToro.',locked?hidden('Positions'):botPositions(b.positions),b.positions.length+' open')}
      ${card('Closed trades','What the bot has finished with, and why it let go.',locked?hidden('Trades'):closedTrades(b),nClosed+' closed')}</div>`;
  } else if(tab==='rest'){
    const p0=(hist&&hist.meta&&hist.meta.rest0)||r.value, d=r.value-p0;
    head=hero(r.value,`EVERYTHING THAT IS NOT THE BOT'S · SINCE ${since}`,d,p0?d/p0*100:0,vsChip(),'since '+since);
    const ps=r.value?r.positions_value/r.value*100:0;
    const sits=card('Where it sits','Cash dominates, so this view moves only when the holdings do — or when money is added or withdrawn.',
      tiles([['Positions',fmt$(r.positions_value),'',`${r.positions.length} holding${r.positions.length===1?'':'s'}`],['Cash',fmt$(r.cash),'','not used by the bot']])+`<div style="margin-top:12px">${split([['Positions',ps,'teal'],['Cash',100-ps,'t5']])}</div>`);
    body=`<div class="page">${chartCard('Rest of portfolio','Measured from the first snapshot, not from a purchase price.')}
      <div class="two">${sits}${baseSheet(r.value,p0,'Measured from the first snapshot, not from a purchase price. A deposit or withdrawal shows up as a step, because this tab charts an account, not a return.')}</div>
      ${card('Holdings','Positions the bot does not manage.',locked?hidden('Holdings'):restHoldings(r),r.positions.length+' held')}</div>`;
  } else if(tab==='news'){
    const items=newsItems(), names=new Set(items.map(i=>i.symbol));
    head=`<div class="hero"><div><div class="val word">Headlines</div><div class="sub">FOR THE NAMES THE BOT HOLDS · GATHERED BY THE BOT, NOT BY THIS PAGE</div></div>
      <div class="chips"><div class="regime">${items.length} headline${items.length===1?'':'s'} · ${names.size} name${names.size===1?'':'s'}</div></div></div>`;
    const feed=locked?card('By position','Newest first. Each headline links to its source.',hidden('Headlines'))
      :news?card('By position','Newest first. Each headline links to its source.',newsFeed(),(news.generated_at?etHM(news.generated_at)+' ET':''))
      :card('No feed yet','Headlines appear here once the bot starts publishing them.','<p class="note">When it does, each name the bot holds gets its own group — the headline next to the position it moves, with the source, the time, and a link out.</p>');
    body=`<div class="page"><div class="two">${feed}${feedSheet()}</div></div>`;
  } else {
    const p0=(hist&&hist.meta&&hist.meta.total0)||t.value, d=t.value-p0;
    head=hero(t.value,`WHOLE ACCOUNT · CASH ${fmt$(t.cash)} · SINCE ${since}`,d,p0?d/p0*100:0,vsChip(),'since '+since);
    const bs=t.value?b.equity/t.value*100:0;
    const comp=card('Composition',`The bot is about ${bs.toFixed(0)}% of the account — which is why every tab has its own scale. On one axis the bot would be a flat line on the floor.`,
      tiles([['Bot',fmt$(b.equity),cls(b.pct),`${fmtP(b.pct)} vs stake`],['Rest',fmt$(r.value),'',`${fmt$(r.positions_value)} in positions`]])+`<div style="margin-top:12px">${split([['Bot',bs,'amber'],['Rest',100-bs,'teal']])}</div>`);
    body=`<div class="page">${chartCard('Whole account','Bot and rest together, measured from the first snapshot.')}
      <div class="two">${comp}${baseSheet(t.value,p0,'Bot and rest together. The bot\'s own gain is measured against its stake on the BOT tab; here everything is measured from the first snapshot.')}</div></div>`;
  }
  $('#view').innerHTML=lockBar()+head+body+(locked?'':'<div class="relock"><button id="relock" type="button">Lock this dashboard</button></div>');
  if(locked) curtain($('#view'));
  document.title=locked?'Dashboardia':(tab==='news'?'News':fmt$(tab==='bot'?b.equity:tab==='rest'?r.value:t.value))+' · Dashboardia';
  drawChart(); watchChart();
  document.querySelectorAll('.seg button').forEach(bt=>bt.addEventListener('click',()=>{range=bt.dataset.r;try{localStorage.setItem('db.range',range)}catch(e){};render()}));
  const mt=$('#mtog'); if(mt) mt.addEventListener('click',()=>{vsOn=!vsOn;try{localStorage.setItem('db.vs',vsOn?'1':'0')}catch(e){};render()});
  wireLock();
}

function wireLock(){
  const uf=$('#unlock');
  if(uf) uf.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const v=$('#pw').value||'';
    if(encrypted||!latest){          // the ciphertext is the authority
      pass=v; try{localStorage.setItem('db.pw',v)}catch(e){}
      await load();
      if(latest){locked=false;scrollTo({top:0})}
      else {badPass=true;render();badPass=false;const p=$('#pw'); if(p) p.focus()}
      return;
    }
    let h=''; try{h=await sha256(v)}catch(e){}
    if(h===PASS_SHA){locked=false;badPass=false;pass=v;
      try{localStorage.setItem('db.key',h);localStorage.setItem('db.pw',v)}catch(e){};render();scrollTo({top:0})}
    else {badPass=true;render();badPass=false;const p=$('#pw'); if(p) p.focus()}
  });
  const rl=$('#relock');
  if(rl) rl.addEventListener('click',()=>{
    locked=true; pass='';
    try{localStorage.removeItem('db.key');localStorage.removeItem('db.pw')}catch(e){}
    if(encrypted){latest=hist=news=null}
    render(); scrollTo({top:0});
  });
}

document.querySelectorAll('#tabs button').forEach(bt=>bt.addEventListener('click',()=>{tab=bt.dataset.tab;try{localStorage.setItem('db.tab',tab)}catch(e){};
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===bt)); if(latest){render(); scrollTo({top:0})}}));
document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===tab));
load(); setInterval(load,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) load()}); // coming back to the tab refreshes at once
})();
</script>
</body>
</html>
